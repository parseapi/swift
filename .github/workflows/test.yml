name: Swift SDK

on: [push, pull_request]

permissions:
  contents: read

jobs:
  minimum:
    name: Swift 6.0 minimum
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Verify minimum compiler
        run: swift --version
      - name: Build and test
        run: swift test

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: '6.3.3'
      - name: Verify compiler
        run: swift --version
      - name: Build and test
        run: swift test
      - name: Check reviewed public API
        run: python3 scripts/check-api.py
